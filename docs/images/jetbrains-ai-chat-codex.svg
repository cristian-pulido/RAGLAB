<svg xmlns="http://www.w3.org/2000/svg" width="520" height="250" viewBox="0 0 520 250" role="img" aria-labelledby="title desc">
  <title id="title">Iniciar una conversaci&#243;n con Codex</title>
  <desc id="desc">AI Chat con Codex seleccionado y un mensaje para iniciar la sesi&#243;n.</desc>
  <rect width="520" height="250" rx="14" fill="#fff" stroke="#d9dde4"/>
  <rect width="520" height="43" rx="14" fill="#f8f9fb"/>
