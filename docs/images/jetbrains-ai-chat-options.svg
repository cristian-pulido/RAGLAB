<svg xmlns="http://www.w3.org/2000/svg" width="520" height="610" viewBox="0 0 520 610" role="img" aria-labelledby="title desc">
  <title id="title">Opciones de agentes y proveedores en AI Chat</title>
  <desc id="desc">Panel de AI Chat con suscripci&#243;n JetBrains AI, agentes integrados, agentes ACP y proveedores externos.</desc>
  <rect width="520" height="610" rx="14" fill="#fff" stroke="#d9dde4"/>
  <g font-family="Arial, sans-serif" fill="#1f2937">
    <text x="20" y="29" font-size="14" fill="#586174">AI Chat</text>
    <text x="20" y="79" font-size="21" font-weight="700">Conecta un agente con tu IDE</text>
    <text x="20" y="111" font-size="13" fill="#697386">Usa JetBrains AI o elige otra opci&#243;n</text>
    <rect x="20" y="126" width="480" height="62" rx="12" fill="#eeeaff"/>
    <circle cx="45" cy="157" r="12" fill="#fff"/><path d="M39 157h12m-6-6v12" stroke="#684ed0" stroke-width="2"/>
    <text x="68" y="152" font-size="14" font-weight="700">Inicia sesi&#243;n con JetBrains AI</text>
    <text x="68" y="172" font-size="12" fill="#697386">Claude, Codex, Junie y m&#225;s</text>
    <text x="20" y="222" font-size="13" fill="#697386">O selecciona tu agente</text>
    <g font-size="14">
      <rect x="20" y="237" width="480" height="42" rx="10" fill="#f3f4f6"/><text x="43" y="263">Claude Agent</text>
      <rect x="20" y="286" width="480" height="42" rx="10" fill="#f3f4f6"/><text x="43" y="312">Codex</text>
      <rect x="20" y="335" width="480" height="42" rx="10" fill="#f3f4f6"/><text x="43" y="361">Junie by JetBrains</text>
      <rect x="20" y="384" width="480" height="42" rx="10" fill="#f3f4f6"/><text x="43" y="410">GitHub Copilot</text>
      <rect x="20" y="433" width="480" height="58" rx="10" fill="#f3f4f6"/><text x="43" y="456">More Agents...</text><text x="43" y="476" font-size="12" fill="#697386">Agentes externos compatibles con ACP</text>
    </g>
    <text x="20" y="526" font-size="13" fill="#697386">Usa un proveedor externo o local</text>
    <rect x="20" y="540" width="480" height="52" rx="10" fill="#f3f4f6"/>
    <text x="43" y="562" font-size="13">OpenAI-compatible, LM Studio, Ollama...</text>
    <text x="43" y="580" font-size="11" fill="#697386">API propia o modelos locales</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="485" cy="151" r="15" fill="#f36f3d" stroke="#fff" stroke-width="3"/><text x="485" y="156" fill="#fff">1</text>
    <circle cx="485" cy="257" r="15" fill="#f36f3d" stroke="#fff" stroke-width="3"/><text x="485" y="262" fill="#fff">2</text>
    <circle cx="485" cy="551" r="15" fill="#f36f3d" stroke="#fff" stroke-width="3"/><text x="485" y="556" fill="#fff">3</text>
  </g>
