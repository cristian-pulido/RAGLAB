<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Copia y guarda la clave cuando OpenRouter la muestra</title>
  <desc id="desc">Ventana oscura con el token oculto y el aviso de que no volverá a mostrarse.</desc>
  <rect width="1200" height="580" rx="24" fill="#080c0d"/>
  <rect x="185" y="58" width="830" height="464" rx="22" fill="#0b1011" stroke="#30393a" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" fill="#f3f6f6" font-family="Arial,sans-serif" font-size="30" font-weight="700">Your new key</text>
  <rect x="270" y="178" width="600" height="72" rx="14" fill="#171d1e" stroke="#30393a"/>
  <text x="296" y="224" fill="#eef2f2" font-family="monospace" font-size="22">sk-or-v1-••••••••••••••••••••••••</text>
  <rect x="886" y="185" width="62" height="58" rx="12" fill="#13191a" stroke="#30393a"/>
  <text x="917" y="224" text-anchor="middle" fill="#d9e0e0" font-family="Arial,sans-serif" font-size="25">▢</text>
  <text x="270" y="305" fill="#aeb8b8" font-family="Arial,sans-serif" font-size="21">Cópiala ahora y guárdala en un lugar seguro.</text>
  <text x="270" y="343" fill="#f3f6f6" font-family="Arial,sans-serif" font-size="21" font-weight="700">No podrás volver a verla completa.</text>
  <rect x="270" y="386" width="658" height="78" rx="12" fill="#25200d" stroke="#d6ff00"/>
  <text x="296" y="420" fill="#e7ecdc" font-family="Arial,sans-serif" font-size="18">No pegues la clave en el repositorio, una captura</text>
  <text x="296" y="447" fill="#e7ecdc" font-family="Arial,sans-serif" font-size="18">ni un mensaje público.</text>
</svg>
